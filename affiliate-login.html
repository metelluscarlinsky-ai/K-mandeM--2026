<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FF6B35">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com;">
    <title>Affilié - KòmandeM</title>
    <link rel="icon" type="image/png" href="assets/images/logo-komndem.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--brand:#FF6B35;--dark:#0A0A1A;--card:#1E293B;--border:rgba(255,255,255,0.06);--text:#E2E8F0;--muted:#94A3B8;--success:#22C55E;--danger:#EF4444;--radius:14px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(135deg,#0A0A1A,#1a1a2e,#0A0A1A);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;padding:20px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:2.5rem;width:100%;max-width:420px;box-shadow:0 25px 80px rgba(0,0,0,0.5);color:white}
        .logo-box{text-align:center;margin-bottom:1.5rem}
        .logo-box img{height:55px;border-radius:14px;margin-bottom:0.5rem}
        .logo-box h1{font-size:1.4rem;font-weight:800}.logo-box h1 span{color:var(--brand)}
        .logo-box .aff-badge{display:inline-block;background:rgba(255,107,53,0.1);color:var(--brand);padding:0.3rem 0.8rem;border-radius:999px;font-size:0.75rem;font-weight:700;margin-top:0.5rem}
        .fg{margin-bottom:1rem}.fg label{display:block;font-weight:600;font-size:0.85rem;color:var(--text);margin-bottom:0.4rem}
        .inp{width:100%;padding:0.8rem;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;font-size:0.95rem;outline:none;font-family:inherit;color:white;box-sizing:border-box}
        .inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,107,53,0.1)}.inp::placeholder{color:#64748B}
        .btn{width:100%;padding:0.9rem;background:var(--brand);color:white;border:none;border-radius:12px;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;transition:all 0.3s}
        .btn:hover{background:#E55A2B;transform:translateY(-1px)}
        .err{background:rgba(239,68,68,0.1);color:var(--danger);padding:0.75rem;border-radius:10px;font-size:0.85rem;margin-bottom:1rem;display:none}
        .err.show{display:block}
        .links{text-align:center;margin-top:1rem;font-size:0.85rem;color:var(--muted)}.links a{color:var(--brand);text-decoration:none;font-weight:600}
        .info-box{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.15);padding:0.75rem;border-radius:10px;font-size:0.8rem;color:#3B82F6;text-align:center;margin-bottom:1rem}
    </style>
</head>
<body>
<div class="card">
    <div class="logo-box">
        <img src="assets/images/logo-komndem.png" alt="KòmandeM" onerror="this.style.display='none'">
        <h1>Kòmande<span>M</span></h1>
        <div class="aff-badge">🤝 Espas Affilié</div>
    </div>
    <div class="info-box">💰 Komisyon: 250 GDS pou chak 1000 GDS vann!</div>
    <div class="err" id="errBox"></div>
    <form onsubmit="return handleLogin(event)">
        <div class="fg"><label>Kòd Affilié</label><input type="text" id="code" class="inp" placeholder="Antre kòd affilié w" required autocomplete="off"></div>
        <div class="fg"><label>Mòdepas</label><input type="password" id="pass" class="inp" placeholder="Mòdepas affilié" required></div>
        <button type="submit" class="btn">🔓 Konekte</button>
    </form>
    <p class="links"><a href="index.html">← Retounen nan Akèy</a></p>
</div>
<script src="js/security.js"></script>
<script>
function handleLogin(e){
    e.preventDefault();
    var code=document.getElementById('code').value.trim().toUpperCase();
    var pass=document.getElementById('pass').value;
    var err=document.getElementById('errBox');
    err.classList.remove('show');
    if(!code||!pass){err.textContent='Antre kòd ak mòdepas';err.classList.add('show');return false}
    var affiliates=JSON.parse(localStorage.getItem('komandem-affiliates')||'[]');
    var aff=affiliates.find(function(a){return a.code===code&&a.password===pass&&a.aktif});
    if(!aff){err.textContent='Kòd oswa mòdepas pa kòrèk!';err.classList.add('show');return false}
    localStorage.setItem('komandem-affiliate-session',JSON.stringify({affiliate:aff,loginTime:new Date().toISOString(),expires:Date.now()+(24*60*60*1000)}));
    window.location.href='affiliate-dashboard.html';
    return false;
}
</script>
</body>
</html>
