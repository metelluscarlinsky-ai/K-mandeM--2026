<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FF6B35">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com;">
    <title>Panye - KòmandeM</title>
    <link rel="icon" type="image/png" href="assets/images/logo-komndem.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--brand:#FF6B35;--dark:#0A0A1A;--card:#1E293B;--border:rgba(255,255,255,0.06);--text:#E2E8F0;--muted:#94A3B8;--success:#22C55E;--danger:#EF4444;--warning:#F59E0B;--radius:14px;--radius-lg:20px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--dark);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
        .topbar{background:var(--card);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:0.75rem}
        .topbar h1{font-size:1.2rem;font-weight:800}.topbar h1 span{color:var(--brand)}
        .topbar-logo{display:flex;align-items:center;gap:0.5rem}.topbar-logo img{height:35px;border-radius:8px}
        .btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.6rem 1.2rem;border-radius:var(--radius);font-weight:600;font-size:0.85rem;cursor:pointer;border:none;font-family:inherit;text-decoration:none;transition:all 0.2s}
        .btn-primary{background:var(--brand);color:white}.btn-primary:hover{background:#E55A2B}
        .btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.1);color:white}
        .btn-danger{background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.2)}
        .btn-success{background:rgba(34,197,94,0.1);color:var(--success);border:1px solid rgba(34,197,94,0.2)}
        .btn-sm{padding:0.35rem 0.75rem;font-size:0.78rem}
        .container{max-width:800px;margin:0 auto;padding:1.5rem}
        .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1.5rem;overflow:hidden}
        .card-header{padding:1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .card-header h3{font-weight:700;font-size:1rem}.card-body{padding:1.25rem}
        
        .cart-item{display:flex;align-items:center;gap:1rem;padding:1rem;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:var(--radius-lg);margin-bottom:0.5rem;transition:all 0.3s}
        .cart-item:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,107,53,0.2)}
        .cart-item-img{width:55px;height:55px;background:linear-gradient(135deg,rgba(255,107,53,0.15),rgba(255,107,53,0.05));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
        .cart-item-details{flex:1;min-width:0}.cart-item-details h4{font-size:0.9rem;font-weight:700;color:white;margin-bottom:0.2rem}
        .cart-item-details .meta{font-size:0.75rem;color:var(--muted)}.cart-item-details .unit-price{font-size:0.78rem;color:var(--brand);font-weight:600}
        .cart-item-actions{display:flex;align-items:center;gap:0.75rem}
        .qty-selector{display:flex;align-items:center;background:rgba(255,255,255,0.04);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.08)}
        .qty-btn{width:30px;height:30px;border:none;background:transparent;color:white;cursor:pointer;font-size:1rem;font-weight:600;display:flex;align-items:center;justify-content:center}
        .qty-btn.minus:hover{background:rgba(239,68,68,0.15);color:#EF4444}.qty-btn.plus:hover{background:rgba(34,197,94,0.15);color:#22C55E}
        .qty-value{width:35px;text-align:center;font-weight:700;font-size:0.9rem;color:white}
        .cart-item-total{font-size:1rem;font-weight:800;color:white;min-width:70px;text-align:right}
        .remove-btn{width:30px;height:30px;border-radius:8px;border:1px solid rgba(239,68,68,0.2);background:rgba(239,68,68,0.05);color:#EF4444;cursor:pointer;font-size:0.8rem;display:flex;align-items:center;justify-content:center;transition:all 0.3s}
        .remove-btn:hover{background:rgba(239,68,68,0.2)}
        
        .promo-box{background:linear-gradient(135deg,rgba(255,107,53,0.08),rgba(255,107,53,0.02));border:1px solid rgba(255,107,53,0.2);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}
        .promo-box label{font-weight:700;color:var(--brand);font-size:0.85rem;display:block;margin-bottom:0.5rem}
        .promo-input-row{display:flex;gap:0.5rem}
        .form-input{width:100%;padding:0.65rem;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--radius);color:white;font-size:0.85rem;outline:none;font-family:inherit;box-sizing:border-box}
        .form-input:focus{border-color:var(--brand)}
        
        .cart-summary{background:rgba(255,107,53,0.05);border:1px solid rgba(255,107,53,0.1);border-radius:var(--radius-lg);padding:1.25rem;margin-top:1rem}
        .summary-line{display:flex;justify-content:space-between;padding:0.4rem 0;font-size:0.85rem;color:var(--muted)}
        .summary-line.total{font-size:1.2rem;font-weight:800;color:white;padding-top:0.75rem;margin-top:0.5rem;border-top:2px solid rgba(255,255,255,0.1)}
        .summary-line.total .amount{color:var(--brand);font-size:1.4rem}
        .summary-line.gratis{color:var(--success);font-weight:700}
        
        .empty-state{text-align:center;padding:3rem;color:var(--muted)}
        .empty-state i{font-size:4rem;display:block;margin-bottom:1rem;opacity:0.3}
        .empty-state h3{color:white;font-size:1.2rem;margin-bottom:0.5rem}
        
        .toast-notification{position:fixed;top:20px;right:-400px;color:white;padding:1rem 1.25rem;border-radius:18px;font-weight:600;font-size:0.85rem;z-index:9999;box-shadow:0 15px 50px rgba(0,0,0,0.5);max-width:350px;font-family:system-ui;cursor:pointer;transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275)}
        
        @media(max-width:600px){.topbar{padding:1rem}.container{padding:1rem}.cart-item{flex-wrap:wrap}}
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-logo">
        <img src="assets/images/logo-komndem.png" alt="KòmandeM" onerror="this.style.display='none'">
        <h1>🛒 <span>Panye</span> w</h1>
    </div>
    <div style="display:flex;gap:0.5rem">
        <a href="index.html" class="btn btn-outline btn-sm">🏠 Akèy</a>
        <a href="kliyan-dashboard.html" class="btn btn-outline btn-sm">📋 Menu</a>
    </div>
</div>

<div class="container">
    
    <div class="card">
        <div class="card-header"><h3>Atik nan panye w</h3></div>
        <div class="card-body">
            <div id="cartItems"></div>
            <div id="emptyCart" class="empty-state" style="display:none">
                <i class="fas fa-shopping-cart"></i>
                <h3>Panye w vid</h3>
                <p>Ajoute kèk pwodui nan Menu pou kòmanse</p>
                <a href="kliyan-dashboard.html" class="btn btn-primary btn-sm" style="margin-top:1rem">🍽️ Ale nan Menu</a>
            </div>
            
            <!-- 🎟️ ESPAS KÒD PROMO -->
            <div class="promo-box" id="promoSection" style="display:none">
                <label>🎟️ Kòd Promo / Affilié</label>
                <div class="promo-input-row">
                    <input type="text" id="promoCode" class="form-input" placeholder="Antre kòd promo oswa kòd affilié">
                    <button class="btn btn-success btn-sm" onclick="applyPromo()" style="white-space:nowrap">🎯 Aplike</button>
                </div>
                <p id="promoStatus" style="font-size:0.75rem;margin-top:0.5rem;display:none"></p>
            </div>
            
            <div id="cartSummary" class="cart-summary" style="display:none">
                <div class="summary-line"><span>Sou-Total</span><span id="sumSub">0 GDS</span></div>
                <div class="summary-line"><span>Tax (10%)</span><span id="sumTax">0 GDS</span></div>
                <div class="summary-line" id="serviceLine"><span>Frè Sèvis</span><span id="sumService">25 GDS</span></div>
                <div class="summary-line"><span>Frè Livrezon</span><span id="sumDelivery">50 GDS</span></div>
                <div class="summary-line total"><span>Total</span><span class="amount" id="sumTotal">0 GDS</span></div>
                <a href="checkout.html" class="btn btn-primary" style="width:100%;margin-top:0.75rem;justify-content:center">
                    <i class="fas fa-lock"></i> Ale nan Peman
                </a>
            </div>
        </div>
    </div>

</div>

<script src="js/security.js"></script>
<script>
var cart=JSON.parse(localStorage.getItem('komandem-panye-temp')||'[]');
var PROMO_CODES={AOUT2026:{code:'AOUT2026',deliveryFree:true,serviceFree:true,validUntil:'2026-08-31'}};
var activePromo=null,deliveryFee=50;

function fm(m){return(m||0).toLocaleString('ht-HT')+' GDS'}

function showToast(msg,type){
    var colors={success:'#22C55E',error:'#EF4444',warning:'#F59E0B',info:'#3B82F6'};
    var icons={success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
    var t=document.createElement('div');t.className='toast-notification';t.style.background=colors[type]||colors.info;
    t.innerHTML=icons[type]+' '+msg;t.onclick=function(){t.remove()};document.body.appendChild(t);
    setTimeout(function(){t.style.right='20px'},50);
    setTimeout(function(){t.style.right='-400px';t.style.opacity='0';setTimeout(function(){if(t.parentNode)t.remove()},400)},4000);
}

function renderCart(){
    if(!cart.length){
        document.getElementById('cartItems').innerHTML='';
        document.getElementById('emptyCart').style.display='block';
        document.getElementById('cartSummary').style.display='none';
        document.getElementById('promoSection').style.display='none';
        return;
    }
    document.getElementById('emptyCart').style.display='none';
    document.getElementById('cartSummary').style.display='block';
    document.getElementById('promoSection').style.display='block';
    
    document.getElementById('cartItems').innerHTML=cart.map(function(item,idx){
        return'<div class="cart-item"><div class="cart-item-img">🍽️</div><div class="cart-item-details"><h4>'+item.non+'</h4><div class="meta">🏪 '+(item.machann_non||'Machann')+'</div><div class="unit-price">'+fm(item.pri_inite)+' / chak</div></div><div class="cart-item-actions"><div class="qty-selector"><button class="qty-btn minus" onclick="updateQty('+idx+',-1)">−</button><div class="qty-value">'+item.kantite+'</div><button class="qty-btn plus" onclick="updateQty('+idx+',1)">+</button></div><div class="cart-item-total">'+fm(item.pri_total)+'</div><button class="remove-btn" onclick="removeItem('+idx+')">✕</button></div></div>';
    }).join('');
    updateSummary();
}

function updateSummary(){
    var sub=cart.reduce(function(s,i){return s+i.pri_total},0);
    var tax=Math.round(sub*0.1);
    var serviceFee=(activePromo&&activePromo.serviceFree)?0:25;
    var delFee=(activePromo&&activePromo.deliveryFree)?0:deliveryFee;
    var total=sub+tax+serviceFee+delFee;
    
    document.getElementById('sumSub').textContent=fm(sub);
    document.getElementById('sumTax').textContent=fm(tax);
    document.getElementById('sumService').textContent=serviceFee===0?'GRATIS 🎉':fm(serviceFee);
    document.getElementById('sumService').style.color=serviceFee===0?'#22C55E':'';
    document.getElementById('sumDelivery').textContent=delFee===0?'GRATIS 🎉':fm(delFee);
    document.getElementById('sumDelivery').style.color=delFee===0?'#22C55E':'';
    document.getElementById('sumTotal').textContent=fm(total);
    
    // Sere aktif promo nan localStorage pou checkout itilize
    localStorage.setItem('komandem-active-promo',JSON.stringify(activePromo));
}

function updateQty(idx,delta){
    cart[idx].kantite+=delta;
    if(cart[idx].kantite<1)cart[idx].kantite=1;
    if(cart[idx].kantite>20)cart[idx].kantite=20;
    cart[idx].pri_total=cart[idx].kantite*cart[idx].pri_inite;
    localStorage.setItem('komandem-panye-temp',JSON.stringify(cart));
    renderCart();
}

function removeItem(idx){
    var name=cart[idx].non;
    cart.splice(idx,1);
    localStorage.setItem('komandem-panye-temp',JSON.stringify(cart));
    renderCart();
    showToast(name+' retire ✕','warning');
}

// 🎟️ APLIKE KÒD PROMO
function applyPromo(){
    var code=document.getElementById('promoCode').value.trim().toUpperCase();
    var status=document.getElementById('promoStatus');
    
    if(!code){
        status.style.display='block';
        status.innerHTML='<span style="color:#F59E0B">⚠️ Antre yon kòd</span>';
        return;
    }
    
    // Verifye kòd promo Out 2026
    if(PROMO_CODES[code]){
        var promo=PROMO_CODES[code];
        var validUntil=new Date(promo.validUntil);
        if(validUntil<new Date()){
            status.style.display='block';
            status.innerHTML='<span style="color:#EF4444">❌ Kòd ekspire! Valab jiska 31 Out</span>';
            activePromo=null;updateSummary();return;
        }
        activePromo=promo;
        status.style.display='block';
        status.innerHTML='<span style="color:#22C55E;font-weight:700">✅ Kòd AOUT2026 aplike! 🎉</span><br><span style="color:#22C55E">🚚 Livrezon GRATIS • 🛍️ Frè Sèvis GRATIS</span>';
        updateSummary();
        showToast('🎉 Kòd AOUT2026 aplike! Livrezon GRATIS!','success');
        return;
    }
    
    // Verifye kòd affilié
    var affiliates=JSON.parse(localStorage.getItem('komandem-affiliates')||'[]');
    var aff=affiliates.find(function(a){return a.code===code&&a.aktif});
    if(aff){
        activePromo={code:code,deliveryFree:false,serviceFree:false,affiliate:true};
        status.style.display='block';
        status.innerHTML='<span style="color:#22C55E">✅ Kòd Affilié '+aff.non+' aplike!</span>';
        updateSummary();
        showToast('🤝 Kòd Affilié '+aff.non+' aplike!','success');
        return;
    }
    
    status.style.display='block';
    status.innerHTML='<span style="color:#EF4444">❌ Kòd pa valid!</span>';
    activePromo=null;
    updateSummary();
}

renderCart();
</script>
</body>
</html>
