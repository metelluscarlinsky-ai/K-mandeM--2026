<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FF6B35">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com;">
    <title>Dashboard Affilié - KòmandeM</title>
    <link rel="icon" type="image/png" href="assets/images/logo-komndem.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--brand:#FF6B35;--dark:#0A0A1A;--card:#1E293B;--border:rgba(255,255,255,0.06);--text:#E2E8F0;--muted:#94A3B8;--success:#22C55E;--danger:#EF4444;--warning:#F59E0B;--radius:14px;--radius-lg:20px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--dark);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
        .topbar{background:var(--card);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:1rem}
        .topbar h1{font-size:1.2rem;font-weight:800}.topbar h1 span{color:var(--brand)}
        .topbar-logo{display:flex;align-items:center;gap:0.5rem}.topbar-logo img{height:35px;border-radius:8px}
        .btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.6rem 1.2rem;border-radius:var(--radius);font-weight:600;font-size:0.85rem;cursor:pointer;border:none;font-family:inherit;text-decoration:none;transition:all 0.2s}
        .btn-primary{background:var(--brand);color:white}.btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.1);color:white}
        .btn-danger{background:rgba(239,68,68,0.1);color:var(--danger)}.btn-sm{padding:0.35rem 0.7rem;font-size:0.75rem}
        .container{max-width:1000px;margin:0 auto;padding:1.5rem}
        .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem}
        .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;text-align:center;transition:all 0.3s}
        .stat-card:hover{border-color:var(--brand);transform:translateY(-2px)}
        .stat-icon{font-size:2rem;margin-bottom:0.5rem}.stat-value{font-size:2rem;font-weight:800}.stat-label{font-size:0.8rem;color:var(--muted)}
        .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1.5rem;overflow:hidden}
        .card-header{padding:1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .card-header h3{font-weight:700;font-size:1rem}.card-body{padding:1.25rem}
        table{width:100%;border-collapse:collapse}
        th{padding:0.75rem;text-align:left;font-size:0.7rem;font-weight:700;color:#64748B;text-transform:uppercase;border-bottom:1px solid var(--border)}
        td{padding:0.75rem;font-size:0.85rem;border-bottom:1px solid var(--border)}
        .badge{display:inline-flex;padding:0.2rem 0.6rem;border-radius:999px;font-size:0.7rem;font-weight:600}
        .badge-success{background:rgba(34,197,94,0.1);color:var(--success)}.badge-brand{background:rgba(255,107,53,0.1);color:var(--brand)}
        .promo-code-box{background:linear-gradient(135deg,rgba(255,107,53,0.1),rgba(255,107,53,0.02));border:2px solid var(--brand);border-radius:var(--radius-lg);padding:1.5rem;text-align:center;margin-bottom:1.5rem}
        .promo-code{font-size:2.5rem;font-weight:800;color:var(--brand);letter-spacing:0.1em}
        @media(max-width:768px){.stats-grid{grid-template-columns:1fr}.topbar{padding:1rem}}
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-logo">
        <img src="assets/images/logo-komndem.png" alt="KòmandeM" onerror="this.style.display='none'">
        <h1>🤝 <span id="affName">Affilié</span></h1>
    </div>
    <button class="btn btn-danger btn-sm" onclick="logout()">Dekonekte</button>
</div>

<div class="container">
    
    <div class="promo-code-box">
        <p style="color:var(--muted);margin-bottom:0.5rem">🎟️ Kòd Promo Ou</p>
        <p class="promo-code" id="affCode">------</p>
        <p style="color:var(--muted);font-size:0.85rem;margin-top:0.5rem">Pataje kòd sa a pou w touche komisyon!</p>
        <button class="btn btn-primary btn-sm" onclick="copyCode()" style="margin-top:0.5rem"><i class="fas fa-copy"></i> Kopiye Kòd</button>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value" id="s1" style="color:var(--success)">0 GDS</div><div class="stat-label">Komisyon Total</div></div>
        <div class="stat-card"><div class="stat-icon">🛒</div><div class="stat-value" id="s2">0</div><div class="stat-label">Kòmand Total</div></div>
        <div class="stat-card"><div class="stat-icon">📊</div><div class="stat-value" id="s3" style="color:var(--brand)">0 GDS</div><div class="stat-label">Komisyon pa 1000 GDS</div></div>
    </div>
    
    <div class="card"><div class="card-header"><h3>📋 Kòmand ak Kòd Ou</h3></div>
    <div class="card-body"><div style="overflow-x:auto"><table><thead><tr><th>Nimewo</th><th>Kliyan</th><th>Total</th><th>Komisyon</th><th>Dat</th></tr></thead><tbody id="ordBody"></tbody></table></div><p id="noOrders" style="display:none;text-align:center;color:var(--muted);padding:2rem">Pa gen kòmand ak kòd ou ankò</p></div></div>

</div>

<script src="js/security.js"></script>
<script>
var session=JSON.parse(localStorage.getItem('komandem-affiliate-session')||'null');
if(!session||session.expires<Date.now()){localStorage.removeItem('komandem-affiliate-session');window.location.href='affiliate-login.html'}
var aff=session.affiliate;document.getElementById('affName').textContent=aff.non;document.getElementById('affCode').textContent=aff.code;
function fm(m){return(m||0).toLocaleString('ht-HT')+' GDS'}
function go(){return JSON.parse(localStorage.getItem('komandem-orders')||'[]')}
function loadStats(){var orders=go();var myOrders=orders.filter(function(o){return o.kòd_promo===aff.code||o.affiliate_code===aff.code});var totalRevenue=myOrders.reduce(function(s,o){return s+(o.total||0)},0);var totalCommission=Math.floor(totalRevenue/1000)*aff.commission;document.getElementById('s1').textContent=fm(totalCommission);document.getElementById('s2').textContent=myOrders.length;document.getElementById('s3').textContent=fm(aff.commission);document.getElementById('ordBody').innerHTML=myOrders.length?myOrders.map(function(o){var comm=Math.floor((o.total||0)/1000)*aff.commission;return'<tr><td><strong style="color:var(--brand)">#'+o.id+'</strong></td><td>'+o.kliyan+'</td><td>'+fm(o.total)+'</td><td><span style="color:var(--success);font-weight:700">'+fm(comm)+'</span></td><td>'+new Date(o.dat).toLocaleDateString('ht-HT')+'</td></tr>'}).join(''):'<tr><td colspan="5">Pa gen kòmand</td></tr>';document.getElementById('noOrders').style.display=myOrders.length?'none':'block'}loadStats();
function copyCode(){navigator.clipboard.writeText(aff.code);alert('✅ Kòd '+aff.code+' kopiye!')}
function logout(){localStorage.removeItem('komandem-affiliate-session');window.location.href='affiliate-login.html'}
</script>
</body>
</html>
